# List of repositories and workflows to track.
# Workflow file rules use basenames such as ci.yml, not .github/workflows/ci.yml paths.
defaults:
  steps_min_workflow_duration_seconds: 600

repos:
  - repo: areal-project/AReaL
    workflows:
      - file: test-areal.yml
      - file: nightly.yml
  - repo: alibaba/ROLL
    workflows:
      - file: ci-npu-mindspeed.yml
      - file: ci-npu-test.yml
  - repo: hiyouga/LlamaFactory
    workflows:
      - file: tests_npu.yml
      - file: tests_cuda.yml
  - repo: modelscope/ms-swift
    workflows:
      - file: citest_npu.yaml
      - file: citest.yaml
  - repo: sgl-project/sglang
    workflows:
      - file: pr-test-npu.yml
      - file: pr-test.yml
      - file: nightly-test-npu.yml
      - file: nightly-test-nvidia.yml
  - repo: tile-ai/tilelang-mlir-ascend
    workflows:
      - file: base_ci.yml
  - repo: tile-ai/tilelang
    workflows:
      - file: ci.yml
  - repo: triton-lang/triton
    workflows:
      - file: ci.yml
  - repo: triton-lang/triton-ascend
    workflows:
      - file: ci.yml
  - repo: verl-project/verl
    workflows:
      - file: e2e_ascend.yml
      - file: vllm.yml
      - file: nightly_ascend.yml
  - repo: ascend/pytorch
    workflows:
      - file: npu-full-test.yml
      - file: npu-sync-test.yml
      - file: npu-test.yml
      - file: torch-npu-upstream-test-trigger.yml
  - repo: ByteDance-Seed/VeOmni
    workflows:
      - file: gpu_e2e_test.yml
      - file: npu_e2e_test.yml
      - file: gpu_unit_tests.yml
      - file: npu_unit_tests.yml
  - repo: vllm-project/vllm-ascend
    workflows:
      - file: pr_test.yaml
      - file: schedule_nightly_test_a2.yaml
      - file: schedule_nightly_test_a3.yaml
