name: Collect CI Data (All Repos)
on:
  # ponytail: Turso 写配额已打满，暂停自动采集以止血；恢复时取消注释下方 schedule 块。
  # schedule:
  #   - cron: '48 * * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Collect a specific repo only (owner/repo). Leave empty to collect all repos.'
        required: false
        type: string
      force:
        description: 'Restart history backfill from the earliest retained day'
        required: false
        default: false
        type: boolean
      reverse:
        description: 'Collect from today backward instead of oldest-first backfill'
        required: false
        default: false
        type: boolean
      skip_rebuild:
        description: 'Skip the rebuild step after collection'
        required: false
        default: false
        type: boolean
      start_date:
        description: 'Rebuild start date (yyyy-mm-dd). Only used when rebuilding.'
        required: false
        type: string
      end_date:
        description: 'Rebuild end date (yyyy-mm-dd). Only used when rebuilding.'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-vllm-ascend:
    if: inputs.repo == '' || inputs.repo == 'vllm-project/vllm-ascend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm config set registry https://registry.npmjs.org
      - run: npm install tsx @octokit/core date-fns js-yaml @libsql/client
      - id: collect
        continue-on-error: true
        run: |
          args=(--repo "vllm-project/vllm-ascend")
          if [ "${WORKFLOW_FORCE}" = "true" ]; then
            args+=(--force-full-backfill)
          fi
          if [ "${WORKFLOW_REVERSE}" = "true" ]; then
            args+=(--reverse)
          fi
          npx tsx etl/scripts/collect.ts "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.VLLM_PROJECT_VLLM_ASCEND }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RETENTION_DAYS: 90
          VERBOSE: 1
          WORKFLOW_FORCE: ${{ inputs.force }}
          WORKFLOW_REVERSE: ${{ inputs.reverse }}
      - id: test-case-stats
        continue-on-error: true
        run: npx tsx etl/scripts/collect-test-case-stats.ts --repo "vllm-project/vllm-ascend"
        env:
          GITHUB_TOKEN: ${{ secrets.VLLM_PROJECT_VLLM_ASCEND }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          VERBOSE: 1
      - if: always() && steps.collect.outcome == 'failure'
        run: |
          echo "Collection completed with partial failures. Data was written to Turso."
          exit 1

