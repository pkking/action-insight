  rebuild:
    needs:
      - collect-vllm-ascend
      - collect-verl
      - collect-triton-ascend
      - collect-llamafactory
      - collect-ms-swift
      - collect-sglang
      - collect-tilelang-ascend
    if: always() && inputs.skip_rebuild != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm config set registry https://registry.npmjs.org
      - run: npm install tsx @octokit/core date-fns js-yaml @supabase/supabase-js pg
      - name: Apply Supabase migrations
        run: npm run migrate:supabase
