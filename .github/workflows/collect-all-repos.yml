name: Collect CI Data (All Repos)
on:
  schedule:
    - cron: '48 * * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Collect a specific repo only (owner/repo). Leave empty to collect all repos.'
        required: false
        type: string
      force:
        description: 'Restart history backfill from the earliest retained day'
        required: false
        default: false
        type: boolean
      reverse:
        description: 'Collect from today backward instead of oldest-first backfill'
        required: false
        default: false
        type: boolean
      skip_rebuild:
        description: 'Skip the rebuild step after collection'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-vllm-ascend:
    if: inputs.repo == '' || inputs.repo == 'vllm-project/vllm-ascend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm config set registry https://registry.npmjs.org
      - run: npm install tsx @octokit/core date-fns js-yaml @supabase/supabase-js pg
      - name: Apply Supabase migrations
        run: npm run migrate:supabase
        env:
          AUTO_MIGRATE_SUPABASE: 1
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
          SUPABASE_DB_SSL: no-verify
      - id: collect
        continue-on-error: true
        run: |
          args=(--repo "vllm-project/vllm-ascend")
          if [ "${WORKFLOW_FORCE}" = "true" ]; then
            args+=(--force-full-backfill)
          fi
          if [ "${WORKFLOW_REVERSE}" = "true" ]; then
            args+=(--reverse)
          fi
          npx tsx etl/scripts/collect.ts "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.VLLM_PROJECT_VLLM_ASCEND }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RETENTION_DAYS: 90
          VERBOSE: 1
          WORKFLOW_FORCE: ${{ inputs.force }}
          WORKFLOW_REVERSE: ${{ inputs.reverse }}
      - id: test-case-stats
        continue-on-error: true
        run: npx tsx etl/scripts/collect-test-case-stats.ts --repo "vllm-project/vllm-ascend"
        env:
          GITHUB_TOKEN: ${{ secrets.VLLM_PROJECT_VLLM_ASCEND }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERBOSE: 1
      - if: always() && steps.collect.outcome == 'failure'
        run: |
          echo "Collection completed with partial failures. Data was written to Supabase."
          exit 1

