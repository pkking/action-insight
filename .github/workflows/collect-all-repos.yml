  rebuild:
    needs:
      - collect-vllm-ascend
      - collect-verl
      - collect-triton-ascend
      - collect-llamafactory
      - collect-ms-swift
      - collect-sglang
      - collect-tilelang-ascend
    if: always() && inputs.skip_rebuild != true
    runs-on: ubuntu-latest
    steps:
      - id: gate
        name: Rebuild schedule gate
        run: |
          # Manual dispatch always rebuilds.
          # Hourly scheduled runs skip rebuild to save Turso write quota;
          # rebuild only runs once daily (03:xx UTC) with a 3-day window.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" != "03" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping rebuild (hour=$HOUR). Daily rebuild at 03:48 UTC."
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.should_run == 'true'
        with:
          lfs: true
      - uses: actions/setup-node@v6
        if: steps.gate.outputs.should_run == 'true'
        with:
          node-version: 22
      - run: npm config set registry https://registry.npmjs.org
        if: steps.gate.outputs.should_run == 'true'
      - run: npm install tsx @octokit/core date-fns js-yaml @libsql/client
        if: steps.gate.outputs.should_run == 'true'
      - name: Set default date range for scheduled runs
        if: steps.gate.outputs.should_run == 'true' && github.event_name == 'schedule'
        run: |
          echo "SCHEDULED_START_DATE=$(date -u -d '3 days ago' +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "SCHEDULED_END_DATE=$(date -u -d '1 day ago' +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: Rebuild PR artifacts
        if: steps.gate.outputs.should_run == 'true'
        run: |
          args=()
          if [ -n "${REBUILD_REPO}" ]; then
            args+=(--repo "${REBUILD_REPO}")
          fi
          if [ -n "${REBUILD_START_DATE}" ]; then
            args+=(--start-date "${REBUILD_START_DATE}")
          fi
          if [ -n "${REBUILD_END_DATE}" ]; then
            args+=(--end-date "${REBUILD_END_DATE}")
          fi
          npx tsx etl/scripts/rebuild-pr-artifacts.ts "${args[@]}"
        env:
          REBUILD_REPO: ${{ inputs.repo || '' }}
          REBUILD_START_DATE: ${{ inputs.start_date || env.SCHEDULED_START_DATE || '' }}
          REBUILD_END_DATE: ${{ inputs.end_date || env.SCHEDULED_END_DATE || '' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PR_ARTIFACT_SEARCH_RESOLUTION_LIMIT: 20
          PR_ARTIFACT_SHA_RESOLUTION_LIMIT: 1000
          GITHUB_TOKEN_PER_REPO_HIYOUGA_LLAMAFACTORY: ${{ secrets.HIYOUGA_LLAMAFACTORY }}
          GITHUB_TOKEN_PER_REPO_MODELSCOPE_MS_SWIFT: ${{ secrets.MODELSCOPE_MS_SWIFT }}
          GITHUB_TOKEN_PER_REPO_SGL_PROJECT_SGLANG: ${{ secrets.SGL_PROJECT_SGLANG }}
          GITHUB_TOKEN_PER_REPO_TILE_AI_TILELANG_ASCEND: ${{ secrets.TILE_AI_TILELANG_ASCEND }}
          GITHUB_TOKEN_PER_REPO_TRITON_LANG_TRITON_ASCEND: ${{ secrets.TRITON_LANG_TRITON_ASCEND }}
          GITHUB_TOKEN_PER_REPO_VERL_PROJECT_VERL: ${{ secrets.VERL_PROJECT_VERL }}
          GITHUB_TOKEN_PER_REPO_VLLM_PROJECT_VLLM_ASCEND: ${{ secrets.VLLM_PROJECT_VLLM_ASCEND }}
