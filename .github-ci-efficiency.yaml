# GitHub Actions duration targets for NPU/GPU CI comparison.
# Workflow names are matched exactly, case-insensitively by the report skill.
# The configuration was checked against the repositories' Actions metadata on
# 2026-07-18. comparison_group identifies a project family and may contain one
# repository (NPU/GPU workflows together) or paired base/Ascend repositories.
# comparison_name is only PR or Nightly, so comparable rows are adjacent.
# Projects without a real GPU or nightly workflow only include available data.

defaults:
  min_e2e_minutes: 10

resource_pools:
  A3: 364
  A2: 104

repositories:
  - repo: sgl-project/sglang
    comparison_group: sglang
    workflows:
      - name: PR Test (NPU)
        file: pr-test-npu.yml
        comparison_name: PR
      - name: PR Test Base
        file: pr-test.yml
        comparison_name: PR
      - name: Nightly Test (NPU)
        file: nightly-test-npu.yml
        comparison_name: Nightly
      - name: Nightly Test (Nvidia)
        file: nightly-test-nvidia.yml
        comparison_name: Nightly

  - repo: verl-project/verl
    comparison_group: verl
    workflows:
      - name: e2e_ascend
        file: e2e_ascend.yml
        comparison_name: PR
      - name: e2e_ppo_trainer
        file: e2e_ppo_trainer.yml
        comparison_name: PR
      - name: nightly_ci_ascend
        file: nightly_ascend.yml
        comparison_name: Nightly

  - repo: ascend/pytorch
    comparison_group: ascend-pytorch
    workflows:
      - name: PyTorch NPU Full Test (v2.7.1)
        file: npu-full-test.yml
        comparison_name: Full Test
      - name: PyTorch NPU Sync Test
        file: npu-sync-test.yml
        comparison_name: Sync Test
      - name: NPU Build and Test
        file: npu-test.yml
        comparison_name: Build and Test
      - name: Torch NPU Upstream v2.7.1 Trigger
        file: torch-npu-upstream-test-trigger.yml
        comparison_name: Upstream Test
      - name: PyTorch CI Trigger
        file: pytorch_ci_trigger.yml
        comparison_name: PR Trigger

  - repo: ByteDance-Seed/VeOmni
    comparison_group: veomni
    workflows:
      - name: GPU e2e tests
        file: gpu_e2e_test.yml
        comparison_name: E2E
        static_resources:
          L20: 8
      - name: NPU e2e tests
        file: npu_e2e_test.yml
        comparison_name: E2E
        static_resources:
          Ascend 910B: 8
      - name: GPU unit tests
        file: gpu_unit_tests.yml
        comparison_name: Unit
        static_resources:
          L20: 8
      - name: NPU unit tests
        file: npu_unit_tests.yml
        comparison_name: Unit
        static_resources:
          Ascend 910B: 8

  - repo: vllm-project/vllm-ascend
    comparison_group: vllm
    workflows:
      - name: E2E
        comparison_name: PR
      - name: Nightly-A2
        comparison_name: Nightly
      - name: Nightly-A3
        comparison_name: Nightly

  - repo: areal-project/AReaL
    comparison_group: areal
    workflows:
      - name: AReaL CI on GCP runner
        comparison_name: PR
      - name: Nightly CI
        comparison_name: Nightly

  - repo: alibaba/ROLL
    comparison_group: roll
    workflows:
      - name: MindSpeed NPU Tests
        file: ci-npu-mindspeed.yml
        comparison_name: PR
      - name: Tests
        file: ci-npu-test.yml
        comparison_name: PR

  - repo: triton-lang/triton
    comparison_group: triton
    workflows:
      - name: Integration Tests
        comparison_name: PR

  - repo: triton-lang/triton-ascend
    comparison_group: triton
    workflows:
      # This PR workflow calls the reusable "Integration Tests NPU" workflow.
      - name: Integration Tests
        comparison_name: PR

  - repo: tile-ai/tilelang
    comparison_group: tilelang
    workflows:
      - name: CI
        comparison_name: PR

  - repo: tile-ai/tilelang-mlir-ascend
    comparison_group: tilelang
    workflows:
      # Base CI is the current PR entrypoint for the Ascend/NPU-IR checks.
      - name: Base CI
        comparison_name: PR

  - repo: modelscope/ms-swift
    comparison_group: ms-swift
    workflows:
      - name: citest-npu
        comparison_name: PR
      - name: citest
        comparison_name: PR

  - repo: hiyouga/LlamaFactory
    comparison_group: llamafactory
    workflows:
      - name: tests_npu
        file: tests_npu.yml
        comparison_name: PR
      - name: tests_cuda
        file: tests_cuda.yml
        comparison_name: PR
