var fmt=function(m){return m>=60?(m/60).toFixed(1)+'h':Math.round(m)+'m'};
function tip(def){return '<span class="group relative inline-flex align-middle ml-1"><span class="inline-flex items-center justify-center rounded-full bg-neutral-700 text-[9px] font-bold leading-none text-neutral-300 cursor-help" style="width:14px;height:14px">?</span><span class="pointer-events-none absolute left-1/2 top-full z-50 mt-1 -translate-x-1/2 w-max max-w-[220px] rounded-lg border border-neutral-700 bg-neutral-800 px-2.5 py-1.5 text-[11px] font-normal normal-case tracking-normal text-neutral-200 shadow-md opacity-0 group-hover:opacity-100 transition-opacity">'+def+'</span></span>';}
function metricCard(label,def,rows){return '<div class="rounded-lg border border-neutral-800 bg-neutral-900/60 p-4"><div class="text-[11px] uppercase tracking-wide text-neutral-400">'+label+tip(def)+'</div><div class="mt-2 space-y-1">'+rows.map(function(r){return '<div class="flex justify-between text-sm font-medium text-neutral-100 num"><span class="text-neutral-500">'+r.k+'</span><span>'+r.v+'</span></div>'}).join('')+'</div></div>';}
function cardGrid(cards){return '<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">'+cards.join('')+'</div>';}
var rows3=function(a,b,c){return [{k:'avg',v:fmt(a)},{k:'p50',v:fmt(b)},{k:'p90',v:fmt(c)}]};
var single=function(v){return [{k:'占比',v:v}]};

var PAGE={};
function stackedBar(key,stacks,opts){
  opts=opts||{};
  var w=1200,h=200,pL=34,pR=opts.line?34:16,pT=16,pB=28;
  var n=stacks[0].values.length;
  var step=(w-pL-pR)/n,bw=step*0.7;
  var x=function(i){return pL+bw/2+i*step};
  var tot=[];for(var i=0;i<n;i++){var s=0;for(var j=0;j<stacks.length;j++){s+=(stacks[j].values[i]||0)}tot.push(s)}
  var mx=Math.max.apply(null,tot.concat([1]));
  var yb=function(v){return h-pB-(v/mx)*(h-pT-pB)};
  var lc=opts.line;if(lc){var lm=Math.max.apply(null,lc.values.concat([1]));lc._y=function(v){return h-pB-(v/lm)*(h-pT-pB)};}
  var grid=[0,.25,.5,.75,1].map(function(f){var yy=(pT+f*(h-pT-pB)).toFixed(1);return '<line x1="'+pL+'" y1="'+yy+'" x2="'+(w-pR)+'" y2="'+yy+'" class="chart-grid"/>'}).join('');
  var yLabs=[0,.25,.5,.75,1].map(function(f){var v=Math.round(mx*(1-f));var yy=(pT+f*(h-pT-pB)).toFixed(1);return '<text x="'+(pL-4)+'" y="'+(parseFloat(yy)+3)+'" class="chart-axis" font-size="9" text-anchor="end">'+v+'m</text>';}).join('');
  var axisL='<line x1="'+pL+'" y1="'+pT+'" x2="'+pL+'" y2="'+(h-pB)+'" class="chart-axis-line"/><line x1="'+pL+'" y1="'+(h-pB)+'" x2="'+(w-pR)+'" y2="'+(h-pB)+'" class="chart-axis-line"/>';
  // 右轴刻度（PR数量，仅当有 line）
  var yRabs='',axisR='';
  if(lc){yRabs=[0,.25,.5,.75,1].map(function(f){var v=Math.round(lm*(1-f));var yy=(pT+f*(h-pT-pB)).toFixed(1);return '<text x="'+(w-pR+4)+'" y="'+(parseFloat(yy)+3)+'" class="chart-axis" style="fill:'+lc.color+'" font-size="9">'+v+'</text>';}).join('');axisR='<line x1="'+(w-pR)+'" y1="'+pT+'" x2="'+(w-pR)+'" y2="'+(h-pB)+'" class="chart-axis-line"/>';}
  var leg=stacks.map(function(s){return '<span class="inline-flex items-center gap-1 text-xs text-neutral-400 ml-3"><span class="inline-block w-2.5 h-2.5 rounded-sm" style="background:'+s.color+'"></span>'+s.label+'</span>'}).join('');
  if(lc)leg+='<span class="inline-flex items-center gap-1 text-xs text-neutral-400 ml-3"><span class="inline-block w-3 h-0.5" style="background:'+lc.color+'"></span>'+lc.label+'(右轴)</span>';
  var bars='';
  for(var i=0;i<n;i++){var y0=h-pB;stacks.forEach(function(seg){var v=seg.values[i]||0;var y1=yb(v);var hh=y0-y1;if(hh>0.3)bars+='<rect data-key="'+key+'" data-i="'+i+'" x="'+(x(i)-bw/2).toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+seg.color+'" opacity="0.85" class="bar-rect" style="cursor:pointer"/>';y0=y1;});}
  var lp='';
  if(lc){lp=lc.values.map(function(v,i){return (i?'L':'M')+x(i).toFixed(1)+','+lc._y(v).toFixed(1)}).join(' ');lp='<path d="'+lp+'" fill="none" stroke="'+lc.color+'" stroke-width="1.5"/>'+lc.values.map(function(v,i){return '<circle cx="'+x(i).toFixed(1)+'" cy="'+lc._y(v).toFixed(1)+'" r="2" fill="'+lc.color+'"/>'}).join('');}
  var xl=opts.xlabels?'<text x="'+pL+'" y="'+(h-8)+'" class="chart-axis" font-size="9">'+opts.xlabels[0]+'</text><text x="'+(w-pR)+'" y="'+(h-8)+'" class="chart-axis" font-size="9" text-anchor="end">'+opts.xlabels[n-1]+'</text>':'';
  return '<div class="rounded-lg border border-neutral-800 bg-neutral-900/60 p-4"><div class="flex items-center justify-between"><div class="text-[11px] uppercase tracking-wide text-neutral-500">'+(opts.title||'趋势')+tip(opts.def||'')+'</div><div>'+(opts.controls||'')+leg+'</div></div><div class="mt-2 overflow-x-auto"><svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;display:block">'+grid+axisL+axisR+yLabs+yRabs+bars+lp+xl+'</svg></div></div>';
}
function multiLine(series,opts){
  opts=opts||{};
  var w=1200,h=200,pL=34,pR=16,pT=16,pB=28;
  var n=series[0].values.length;
  var all=[];series.forEach(function(s){all=all.concat(s.values)});
  var mn=Math.min.apply(null,all.concat([0])),mx2=Math.max.apply(null,all.concat([1]));
  var x=function(i){return pL+i*(w-pL-pR)/(n-1||1)};
  var y=function(v){return h-pB-(v-mn)/(mx2-mn||1)*(h-pT-pB)};
  var grid=[0,.25,.5,.75,1].map(function(f){var yy=(pT+f*(h-pT-pB)).toFixed(1);return '<line x1="'+pL+'" y1="'+yy+'" x2="'+(w-pR)+'" y2="'+yy+'" class="chart-grid"/>'}).join('');
  // 纵轴刻度
  var yLabs=[0,.25,.5,.75,1].map(function(f){var v=Math.round((mn+(mx2-mn)*(1-f)));var yy=(pT+f*(h-pT-pB)).toFixed(1);return '<text x="'+(pL-4)+'" y="'+(parseFloat(yy)+3)+'" class="chart-axis" font-size="9" text-anchor="end">'+v+'</text>';}).join('');
  var axisL='<line x1="'+pL+'" y1="'+pT+'" x2="'+pL+'" y2="'+(h-pB)+'" class="chart-axis-line"/><line x1="'+pL+'" y1="'+(h-pB)+'" x2="'+(w-pR)+'" y2="'+(h-pB)+'" class="chart-axis-line"/>';
  var leg=series.map(function(s){return '<span class="inline-flex items-center gap-1 text-xs text-neutral-400 ml-3"><span class="inline-block w-3 h-0.5" style="background:'+s.color+'"></span>'+s.label+'</span>'}).join('');
  var xl=opts.xlabels?'<text x="'+pL+'" y="'+(h-8)+'" class="chart-axis" font-size="9">'+opts.xlabels[0]+'</text><text x="'+(w-pR)+'" y="'+(h-8)+'" class="chart-axis" font-size="9" text-anchor="end">'+opts.xlabels[n-1]+'</text>':'';
  var paths=series.map(function(s){return '<path d="'+s.values.map(function(v,i){return (i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)}).join(' ')+'" fill="none" stroke="'+s.color+'" stroke-width="1.5"/>'}).join('');
  return '<div class="rounded-lg border border-neutral-800 bg-neutral-900/60 p-4"><div class="flex items-center justify-between"><div class="text-[11px] uppercase tracking-wide text-neutral-500">'+(opts.title||'趋势')+tip(opts.def||'')+'</div><div>'+(opts.controls||'')+leg+'</div></div><div class="mt-2 overflow-x-auto"><svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:'+h+'px;display:block">'+grid+axisL+yLabs+paths+xl+'</svg></div></div>';
}
function pagedTable(key,headers,rows,page,ps,merge){
  page=page||1;ps=ps||5;
  var MAX=500,overCap=false,orig=rows.length;
  if(rows.length>MAX){overCap=true;rows=rows.slice(0,MAX);}
  var tp=Math.max(1,Math.ceil(rows.length/ps));
  page=Math.min(Math.max(1,page),tp);
  PAGE[key]=page;
  var slice=rows.slice((page-1)*ps,page*ps);
  var th=headers.map(function(h){return '<th class="'+(h.cls||'')+' font-medium py-2">'+h.label+(h.def?tip(h.def):'')+'</th>'}).join('');
  function cellVal(r,h){var v=r[h.key];return (h.fmt?fmt(v):v)+(h.suffix||'');}
  function cellCls(h){return h.cls||'';}
  var body=slice.map(function(r,ri){
    var tds='';
    headers.forEach(function(h,ci){
      var doMerge=merge&&merge.indexOf(ci)>=0;
      if(doMerge){
        var prev=ri>0?slice[ri-1][h.key]:undefined;
        if(r[h.key]===prev){return;}
        var span=1;for(var k=ri+1;k<slice.length&&slice[k][h.key]===r[h.key];k++){span++;}
        tds+='<td class="'+cellCls(h)+'" rowspan="'+span+'" valign="middle">'+cellVal(r,h)+'</td>';
      }else{
        var c=cellCls(h);if(h.color){var v=r[h.key];c+=' '+(v>=h.color[2]?'text-emerald-400':v>=h.color[1]?'text-amber-400':'text-red-400');}
        tds+='<td class="'+c+'">'+cellVal(r,h)+'</td>';
      }
    });
    return '<tr id="tr-'+key+'-'+ri+'" class="border-b border-neutral-900 hover:bg-neutral-900/50">'+tds+'</tr>';
  }).join('');
  var warn=overCap?'<div class="px-3 py-2 text-xs text-amber-400 border-t border-amber-900 bg-amber-900/10">⚠ 采集点超过 '+MAX+' 个（共 '+orig+'），只显示最新 '+MAX+' 个。缩小日期范围可查看更多。</div>':'';
  return '<div class="rounded-lg border border-neutral-800 bg-neutral-900/60"><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-xs text-neutral-500 border-b border-neutral-800">'+th+'</tr></thead><tbody class="num text-sm font-medium">'+body+'</tbody></table></div><div class="flex items-center justify-between px-3 py-2 text-xs text-neutral-500"><span>第 '+page+'/'+tp+' 页 · 共 '+rows.length+' 行'+(overCap?'(截断)':'')+'</span><span class="flex gap-1"><button onclick="setPage(\''+key+'\','+(page-1)+')" class="px-2 py-0.5 rounded '+(page<=1?'opacity-30 cursor-default':'hover:bg-neutral-800')+'">上一页</button><button onclick="setPage(\''+key+'\','+(page+1)+')" class="px-2 py-0.5 rounded '+(page>=tp?'opacity-30 cursor-default':'hover:bg-neutral-800')+'">下一页</button></span></div>'+warn+'</div>';
}

function threeSeg(c,t,tab,f,tb){return '<div class="space-y-4">'+(tb?'<div class="flex items-center py-1">'+tb+'</div>':'')+cardGrid(c)+t+tab+(f?'<div class="text-xs text-neutral-600">'+f+'</div>':'')+'</div>';}

function prBlock(){

  // 按日期筛（days内）— mock 数据有 date，取最近 days 天
  var dates=[...new Set(allRows.map(function(r){return r.date}))].sort().reverse();

  var statRepo=(sel==='all')?p:p.repos.filter(function(x){return x.name===sel})[0];
  cards=[
    metricCard('PR 端到端时间','从 PR 提交到最终合入的总时长（排队+执行+审核）。',rows3(statRepo.e2eAvg,statRepo.e2eP50,statRepo.e2eP90)),
    metricCard('CI 时间','workflow 的执行耗时（CI 部分）。',rows3(statRepo.ciAvg,statRepo.ciP50,statRepo.ciP90)),
    metricCard('审核时间','最后一次 workflow CI 结束到合入的时长。',rows3(statRepo.revAvg,statRepo.revP50,statRepo.revP90)),
    metricCard('强行合入率','PR 合入时间早于 CI 完成时间的比例。',single(statRepo.forceMerge+'%')),
    metricCard('总 PR 数','当前区间内合入的 PR 总数。',[{k:'合计',v:filtered.length+(truncated?'+(截断)':'')}])
  ];
  var stacks=[{label:'排队',color:'#3b82f6',values:sl.map(function(r){return r.q})},{label:'执行',color:'#14b8a6',values:sl.map(function(r){return r.ex})},{label:'审核',color:'#f97316',values:sl.map(function(r){return r.rv})}];
  var cnt=sl.map(function(_,i){var dc=(sel==='all')?p.repos[0].dailyCount:statRepo.dailyCount;return (dc&&dc[(pg-1)*ps+i])||0});
  var t=stackedBar('pr',stacks,{title:'每个 PR 的端到端耗时（堆叠）+ PR数量',def:'端到端=排队+执行+审核。点击柱子展开 PR 详情。',xlabels:sl.map(function(r){return r.n}),line:{label:'PR数量',color:'#a78bfa',values:cnt}});
  var tab=prTable(sl,pg,ps,filtered.length);
  var warn=truncated?'<div class="rounded-lg border border-amber-800 bg-amber-900/20 px-3 py-2 text-xs text-amber-400">⚠ 当前区间 PR 超过 '+MAX+' 个，只显示最新的 '+MAX+' 个。如需查看更多，请缩小日期范围。</div>':'';
  var tb=dateCtrl+ctrl;
  return threeSeg(cards,t,tab,'端到端=排队+执行+审核',tb)+(warn?'<div class="mt-3">'+warn+'</div>':'');
}

function prTable(sl,pg,ps,total){

// workflow 可下钻明细表（选中仓库后）
function wfDrillTable(repo,rows,pg){
  var ps=5;
  var tp=Math.max(1,Math.ceil(rows.length/ps));
  pg=Math.min(Math.max(1,pg),tp);PAGE.wf=pg;
  var sl=rows.slice((pg-1)*ps,pg*ps);
  var th='<tr class="text-xs text-neutral-500 border-b border-neutral-800"><th class="w-7"></th><th class="text-left font-medium py-1.5 pl-2">Workflow</th><th class="text-right font-medium"'+tip('resource_model。')+'>资源</th><th class="text-right font-medium"'+tip('平均端到端耗时。')+'>平均耗时</th><th class="text-right font-medium"'+tip('运行次数。')+'>次数</th><th class="text-right font-medium">成功</th><th class="text-right font-medium pr-2">失败率</th></tr>';
  // 合并同类项：连续同 workflow 的行用 rowspan 合并 Workflow 名 + toggle
  var body=sl.map(function(x,ri){
    var idx=(pg-1)*ps+ri;
    var wf=x.wf;
    var isStart=ri===0||sl[ri-1].wf!==wf;
    var span=1;
    if(isStart){for(var k=ri+1;k<sl.length&&sl[k].wf===wf;k++){span++;}}
    var wfCell=isStart?'<td class="pl-2 font-normal text-neutral-300" '+(span>1?'rowspan="'+span+'"':'')+' valign="middle">'+wf+'</td>':'';
    var toggle=isStart?'<td class="w-7 text-center text-sky-400" '+(span>1?'rowspan="'+span+'"':'')+' valign="middle"><span class="arrow inline-block transition-transform" id="arwf_'+idx+'">▶</span></td>':'<td class="w-7"></td>';
    return '<tr class="border-b border-neutral-900 cursor-pointer hover:bg-neutral-900/50" onclick="toggleWf(\''+repo+'\',\''+wf+'\','+idx+')">'+toggle+wfCell+'<td class="text-right text-neutral-400">'+x.res+'</td><td class="text-right num text-neutral-200">'+fmt(x.avgDur)+'</td><td class="text-right num text-neutral-400">'+x.runs+'</td><td class="text-right num text-emerald-400">'+x.succ+'</td><td class="text-right pr-2 num text-red-400">'+(x.runs?Math.round(x.fail/x.runs*100)+'%':'-')+'</td></tr><tr class="detail" id="detwf_'+idx+'" style="display:none"><td colspan="7" class="bg-neutral-950/50 p-2 pl-9" id="dcwf_'+idx+'"></td></tr>';
  }).join('');
  return '<div class="rounded-lg border border-neutral-800 bg-neutral-900/60"><div class="overflow-x-auto"><table class="w-full text-sm"><thead>'+th+'</thead><tbody class="num text-sm font-medium">'+body+'</tbody></table></div>'+pager('wf',pg,tp,rows.length)+'</div>';

// 资源拆分子表：workflow 跨多资源时展示每种资源的耗时/次数/成功率/机时
function renderResourceSplit(wfObj){
  var th='<tr class="text-xs text-neutral-500 border-b border-neutral-800"><th class="text-left font-medium py-1.5 pl-2">资源</th><th class="text-right font-medium">次数</th><th class="text-right font-medium">平均耗时</th><th class="text-right font-medium">成功</th><th class="text-right font-medium">失败率</th><th class="text-right font-medium pr-2">机时</th></tr>';
  var body=wfObj.resources.map(function(r){var f=(r.runs?Math.round(r.fail/r.runs*100):0);return '<tr class="border-b border-neutral-900"><td class="pl-2 text-neutral-300">'+r.res+'</td><td class="text-right num text-neutral-400">'+r.runs+'</td><td class="text-right num text-neutral-200">'+fmt(r.avgDur)+'</td><td class="text-right num text-emerald-400">'+r.succ+'</td><td class="text-right num text-red-400">'+f+'%</td><td class="text-right pr-2 num text-sky-400">'+r.hours.toLocaleString()+' h</td></tr>';}).join('');
  return '<div class="mb-2"><div class="text-[11px] uppercase tracking-wide text-neutral-500 mb-1">该 workflow 机时按资源拆分'+tip('同一 workflow 跨多种资源，按 resource_model 拆分。')+'>机时拆分</div><table class="w-full text-sm"><thead>'+th+'</thead><tbody class="num text-sm font-medium">'+body+'</tbody></table></div>';
}
function renderWfRuns(runs){
  if(!runs.length)return '<p class="text-xs text-neutral-600 p-2">无运行数据</p>';
  var sl=runs.slice(0,5);
  var stacks=[{label:'排队',color:'#3b82f6',values:sl.map(function(r){return r.q})},{label:'执行',color:'#14b8a6',values:sl.map(function(r){return r.ex})}];
  var chart=stackedBar('wfr',stacks,{title:'该 workflow 运行流水（堆叠：排队+执行）',def:'端到端=排队+执行。每根=一次运行。',xlabels:sl.map(function(r){return String(r.id).slice(-5)})});
  var th='<tr class="text-xs text-neutral-500 border-b border-neutral-800"><th class="text-left font-medium py-1.5 pl-2">Run ID</th><th class="text-right font-medium">排队</th><th class="text-right font-medium">执行</th><th class="text-right font-medium">日期</th><th class="text-right font-medium pr-2">状态</th></tr>';
  var body=sl.map(function(r){return '<tr class="border-b border-neutral-900"><td class="pl-2 text-neutral-300">'+r.id+'</td><td class="text-right num text-amber-400/80">'+fmt(r.q)+'</td><td class="text-right num text-neutral-200">'+fmt(r.ex)+'</td><td class="text-right text-neutral-400">'+r.date+'</td><td class="text-right pr-2 '+(r.succ?'text-emerald-400':'text-red-400')+'">'+(r.succ?'成功':'失败')+'</td></tr>'}).join('');
  return chart+'<div class="mt-2 overflow-x-auto"><table class="w-full text-sm"><thead>'+th+'</thead><tbody class="num text-sm font-medium">'+body+'</tbody></table></div>';
}

function jobBlock(){
  var j=DATA.jobs;
  var sel=window._jobSel||'all';
  var ctrl='<select onchange="window._jobSel=this.value;render()" class="bg-neutral-900 border border-neutral-800 rounded px-2 py-0.5 text-xs text-neutral-400 mr-3"><option value="all" '+(sel==='all'?'selected':'')+'>全部仓库</option>'+j.repos.map(function(r){return '<option value="'+r.name+'" '+(sel===r.name?'selected':'')+'>'+r.name+'</option>'}).join('')+'</select>';
  var cards,t,rows;
  if(sel==='all'){
    cards=[
      metricCard('总作业数','所有仓库所有作业总数。',[{k:'合计',v:j.total.toLocaleString()}]),
      metricCard('端到端 P50','全部作业端到端的 50 分位。',[{k:'p50',v:fmt(j.p50)}]),
      metricCard('端到端 P90','全部作业端到端的 90 分位。',[{k:'p90',v:fmt(j.p90)}]),
      metricCard('成功率','conclusion=success 的作业占比。',single(j.succ+'%')),
      metricCard('仓库数','产生作业的仓库数。',[{k:'合计',v:j.repos.length}])
    ];
    rows=[];j.repos.forEach(function(r){r.jobs.forEach(function(jb){rows.push({repo:r.name,job:jb.name,res:jb.res,avgDur:jb.avgDur,runs:jb.runs,succ:jb.succ,fail:jb.fail,hours:jb.hours.toLocaleString()})})});
    t=multiLine(j.repos.map(function(r){var d=r.jobs[0].daily.map(function(_,i){return r.jobs.reduce(function(s,jb){return s+(jb.daily[i]||0)},0)});return {label:r.name,color:r.color,values:d}}),{title:'各仓库每日作业数趋势',def:'选某仓库可聚焦。',xlabels:DAYS});
  }else{
    var r=j.repos.filter(function(x){return x.name===sel})[0];
    var totRuns=r.jobs.reduce(function(s,jb){return s+jb.runs},0);
    var totSucc=r.jobs.reduce(function(s,jb){return s+jb.succ},0);
    var totHours=r.jobs.reduce(function(s,jb){return s+jb.hours},0);
    var topJob=r.jobs.slice().sort(function(a,b){return b.hours-a.hours})[0];
    cards=[
      metricCard('总作业数','该仓库所有作业总数。',[{k:'合计',v:totRuns.toLocaleString()}]),
      metricCard('成功率','该仓库 conclusion=success 的作业占比。',[{k:'占比',v:(totRuns?Math.round(totSucc/totRuns*100):0)+'%'}]),
      metricCard('总机时','该仓库消耗的 NPU 机时。',[{k:'合计',v:totHours.toLocaleString()+' h'}]),
      metricCard('job 数','该仓库的 job 数量。',[{k:'合计',v:r.jobs.length}]),
      metricCard('TOP job','机时消耗最大的 job。',[{k:topJob.name,v:topJob.hours.toLocaleString()+' h'}])
    ];
    t=multiLine(r.jobs.map(function(jb){return {label:jb.name,color:jb.color||'#3b82f6',values:jb.daily}}),{title:'该仓库各 job 每日次数',def:'选某 job 可下钻看运行流水。',xlabels:DAYS});
    rows=r.jobs.map(function(jb){return {repo:r.name,job:jb.name,res:jb.res,avgDur:jb.avgDur,runs:jb.runs,succ:jb.succ,fail:jb.fail,hours:jb.hours.toLocaleString()}});
  }
  var h=[
    {label:'Job',cls:'text-left pl-2 font-normal text-neutral-300',key:'job'},
    {label:'仓库',cls:'text-right font-normal text-neutral-400',key:'repo'},
    {label:'资源',cls:'text-right',key:'res',def:'resource_model（runner 机型）。'},
    {label:'平均耗时',cls:'text-right',key:'avgDur',fmt:true,def:'该 job 平均端到端耗时。'},
    {label:'次数',cls:'text-right font-normal text-neutral-400',key:'runs',def:'运行次数。'},
    {label:'成功',cls:'text-right text-emerald-400',key:'succ',def:'conclusion=success 次数。'},
    {label:'失败率',cls:'text-right pr-2',key:'_fail',def:'失败次数/总次数。'}
  ];
  rows=rows.map(function(x){return Object.assign({},x,{_fail:(x.runs?(Math.round(x.fail/x.runs*100)+'%'):'-')})});
  var tabHtml=pagedTable('job',h,rows,PAGE.job||1,5,[0,1]);
  if(sel!=='all'){tabHtml=jobDrillTable(sel,rows,PAGE.job||1);}
  return threeSeg(cards,t,tabHtml,'端到端=排队+执行（成本仅计执行部分）',ctrl);
}
// job 可下钻明细表（选中仓库后）
function jobDrillTable(repo,rows,pg){
  var ps=5;var tp=Math.max(1,Math.ceil(rows.length/ps));pg=Math.min(Math.max(1,pg),tp);PAGE.job=pg;
  var sl=rows.slice((pg-1)*ps,pg*ps);
  var th='<tr class="text-xs text-neutral-500 border-b border-neutral-800"><th class="w-7"></th><th class="text-left font-medium py-1.5 pl-2">Job</th><th class="text-right font-medium"'+tip('resource_model。')+'>资源</th><th class="text-right font-medium"'+tip('平均端到端耗时。')+'>平均耗时</th><th class="text-right font-medium"'+tip('运行次数。')+'>次数</th><th class="text-right font-medium">成功</th><th class="text-right font-medium pr-2">失败率</th></tr>';
  var body=sl.map(function(x,ri){var idx=(pg-1)*ps+ri;return '<tr class="border-b border-neutral-900 cursor-pointer hover:bg-neutral-900/50" onclick="toggleJobDrill(\''+repo+'\',\''+x.job+'\','+idx+')"><td class="w-7 text-center text-sky-400"><span class="arrow inline-block transition-transform" id="arjb_'+idx+'">▶</span></td><td class="pl-2 font-normal text-neutral-300">'+x.job+'</td><td class="text-right text-neutral-400">'+x.res+'</td><td class="text-right num text-neutral-200">'+fmt(x.avgDur)+'</td><td class="text-right num text-neutral-400">'+x.runs+'</td><td class="text-right num text-emerald-400">'+x.succ+'</td><td class="text-right pr-2 num text-red-400">'+(x.runs?Math.round(x.fail/x.runs*100)+'%':'-')+'</td></tr><tr class="detail" id="detjb_'+idx+'" style="display:none"><td colspan="7" class="bg-neutral-950/50 p-2 pl-9" id="dcjb_'+idx+'"></td></tr>';}).join('');
  return '<div class="rounded-lg border border-neutral-800 bg-neutral-900/60"><div class="overflow-x-auto"><table class="w-full text-sm"><thead>'+th+'</thead><tbody class="num text-sm font-medium">'+body+'</tbody></table></div>'+pager('job',pg,tp,rows.length)+'</div>';
}
function toggleJobDrill(repo,job,idx){
  var det=document.getElementById('detjb_'+idx),ar=document.getElementById('arjb_'+idx);
  var open=det.style.display==='table-row';
  if(open){det.style.display='none';ar.classList.remove('rotate-90');return;}
  if(!det.dataset.d){var r=DATA.jobs.repos.filter(function(x){return x.name===repo})[0];var runs=r.runs.filter(function(x){return x.job===job});document.getElementById('dcjb_'+idx).innerHTML=renderJobRuns(runs);det.dataset.d='1';}
  det.style.display='table-row';ar.classList.add('rotate-90');
}
function renderJobRuns(runs){
  if(!runs.length)return '<p class="text-xs text-neutral-600 p-2">无运行数据</p>';
  var sl=runs.slice(0,5);
  var stacks=[{label:'排队',color:'#3b82f6',values:sl.map(function(r){return r.q})},{label:'执行',color:'#14b8a6',values:sl.map(function(r){return r.ex})}];
  var chart=stackedBar('jbr',stacks,{title:'该 job 运行流水（堆叠：排队+执行）',def:'排队=queue_duration_seconds；执行=duration_seconds。',xlabels:sl.map(function(r){return String(r.id).slice(-5)})});
  var th='<tr class="text-xs text-neutral-500 border-b border-neutral-800"><th class="text-left font-medium py-1.5 pl-2">Job ID</th><th class="text-right font-medium">排队</th><th class="text-right font-medium">执行</th><th class="text-right font-medium">资源</th><th class="text-right font-medium">日期</th><th class="text-right font-medium pr-2">状态</th></tr>';
  var body=sl.map(function(r){return '<tr class="border-b border-neutral-900"><td class="pl-2 text-neutral-300">'+r.id+'</td><td class="text-right num text-amber-400/80">'+fmt(r.q)+'</td><td class="text-right num text-neutral-200">'+fmt(r.ex)+'</td><td class="text-right text-neutral-400">'+r.res+'</td><td class="text-right text-neutral-400">'+r.date+'</td><td class="text-right pr-2 '+(r.succ?'text-emerald-400':'text-red-400')+'">'+(r.succ?'成功':'失败')+'</td></tr>'}).join('');
  return chart+'<div class="mt-2 overflow-x-auto"><table class="w-full text-sm"><thead>'+th+'</thead><tbody class="num text-sm font-medium">'+body+'</tbody></table></div>';
}

function queueBlock(){
  var q=DATA.queue;
  var c=[
    metricCard('排队 P50','全部作业排队时间的 50 分位。',[{k:'p50',v:fmt(q.p50)}]),
    metricCard('排队 P90','全部作业排队时间的 90 分位。',[{k:'p90',v:fmt(q.p90)}]),
    metricCard('最长排队','单次作业最长排队时间。',[{k:'max',v:fmt(q.max)}]),
    metricCard('排队>1h 占比','排队超过1小时的作业占比。',[{k:'占比',v:q.over1h+'%'}]),
    metricCard('资源类型','采集到的 runner 类型数。',[{k:'合计',v:q.byResource.length}])
  ];
  var sel=window._qs||'all';
  var ser=sel==='all'?q.byResource:q.byResource.filter(function(r){return r.type===sel});
  var ctrl='<select onchange="window._qs=this.value;render()" class="bg-neutral-900 border border-neutral-800 rounded px-2 py-0.5 text-xs text-neutral-400 mr-3"><option value="all" '+(sel==='all'?'selected':'')+'>全部资源</option>'+q.byResource.map(function(r){return '<option value="'+r.type+'" '+(sel===r.type?'selected':'')+'>'+r.type+'</option>'}).join('')+'</select>';
  var t=multiLine(ser.map(function(r){return {label:r.type,color:r.color,values:r.daily}}),{title:'各资源类型的排队趋势',def:'按 resource_type 拆分的每日排队时间。',xlabels:DAYS});
  var h=[{label:'Job',cls:'text-left pl-2 font-normal text-neutral-300',key:'name'},{label:'排队 P90',cls:'text-right',key:'p90q',def:'该作业排队时间的 90 分位。',fmt:true},{label:'资源',cls:'text-right',key:'res',def:'resource_model。'},{label:'次数',cls:'text-right font-normal text-neutral-400',key:'count'},{label:'成功率',cls:'text-right pr-2',key:'succ',def:'conclusion=success 的作业占比。',color:[100,90,80],suffix:'%'}];
  var queueItems = sel==='all' ? q.items : q.items.filter(function(x){return x.res===sel});
  var tab=pagedTable('queue',h,queueItems,PAGE.queue||1,5);
  return threeSeg(c,t,tab,'排队 = created_at → started_at',ctrl);
}

// ---- variants & router ----
var DIMS=[
  {key:'pr',label:'PR 分析',render:prBlock},
  {key:'cost',label:'成本',render:costBlock},
  {key:'workflow',label:'工作流',render:wfBlock},
  {key:'job',label:'作业',render:jobBlock},
  {key:'queue',label:'排队',render:queueBlock}
];
function chrome(){
  var isDark=document.documentElement.classList.contains('dark');
  return '<div class="flex items-center gap-3 px-4 py-3 border-b" style="background:var(--md-surface);border-color:var(--md-border)"><div class="font-medium text-base" style="color:var(--md-text)">Action Insight</div><div class="text-xs" style="color:var(--md-text-sec)">'+DATA.range+'</div><button onclick="toggleTheme()" class="ml-auto inline-flex items-center gap-1.5 rounded-full px-3 py-1.5 text-xs" style="background:var(--md-card);color:var(--md-text-sec);box-shadow:var(--md-shadow);border:1px solid var(--md-border)"><span id="theme-icon">'+(isDark?'☀':'☾')+'</span><span id="theme-label">'+(isDark?'亮色':'暗色')+'</span></button></div>';
}
function toggleTheme(){
  var html=document.documentElement;html.classList.toggle('dark');
  var isDark=html.classList.contains('dark');
  var icon=document.getElementById('theme-icon'),label=document.getElementById('theme-label');
  if(icon)icon.textContent=isDark?'☀':'☾';
  if(label)label.textContent=isDark?'亮色':'暗色';
}
function variantA(active){
  var cur=DIMS.filter(function(d){return d.key===active})[0]||DIMS[0];
  var items=DIMS.map(function(d){return '<button onclick="go(\''+d.key+'\')" class="w-full text-left px-3 py-2 rounded text-xs '+(d.key===active?'bg-sky-900/40 text-sky-300 border-l-2 border-sky-500':'text-neutral-400 hover:bg-neutral-900 border-l-2 border-transparent')+'">'+d.label+'</button>'}).join('');
  return chrome()+'<div class="flex" style="height:calc(100vh - 49px)"><nav class="w-44 shrink-0 p-2 overflow-y-auto" style="background:var(--md-surface);border-right:1px solid var(--md-border)"><div class="text-[10px] uppercase tracking-wider px-3 mt-1 mb-2" style="color:var(--md-text-sec)">维度</div>'+items+'</nav><main class="flex-1 overflow-auto p-5"><div class="flex items-center justify-between mb-4"><h2 class="text-lg font-semibold" style="color:var(--md-text)">'+cur.label+'</h2><div class="text-xs" style="color:var(--md-text-sec)">Variant A · Rail + Dense</div></div>'+cur.render()+'</main></div>';
}
function variantB(){
  return chrome()+'<div class="px-5 pt-4 pb-20"><div class="flex items-center mb-5"><div class="text-xs text-neutral-500">Variant B · Card Wall（全部维度同屏滚动）</div></div><div class="space-y-6">'+DIMS.map(function(c){return '<section><h3 class="text-sm font-semibold text-neutral-200 mb-2.5">'+c.label+'</h3>'+c.render()+'</section>'}).join('')+'</div></div>';
}
function variantC(active){
  var cur=DIMS.filter(function(d){return d.key===active})[0]||DIMS[0];
  var tabs=DIMS.map(function(d){return '<button onclick="go(\''+d.key+'\')" class="px-3 py-1.5 rounded-md text-xs '+(d.key===active?'bg-neutral-800 text-sky-300':'text-neutral-400 hover:text-neutral-200')+'">'+d.label+'</button>'}).join('');
  return chrome()+'<div class="flex items-center gap-1 px-4 py-2 border-b border-neutral-800">'+tabs+'<div class="ml-auto text-xs text-neutral-500">Variant C · Tabs</div></div><main class="p-5 overflow-auto" style="height:calc(100vh - 89px)">'+cur.render()+'</main>';
}
var VARIANTS=[
  {key:'A',name:'Rail + Dense',render:function(s){return variantA(s.tab)}},
  {key:'B',name:'Card Wall',render:function(){return variantB()}},
  {key:'C',name:'Tabs',render:function(s){return variantC(s.tab)}}
];
function state(){var p=new URLSearchParams(location.search);return{variant:p.get('variant')||'A',tab:p.get('tab')||'pr'};}
function setParam(k,v){var p=new URLSearchParams(location.search);p.set(k,v);history.replaceState(null,'','?'+p.toString());render();}
function go(tab){setParam('tab',tab);}
function setPage(key,page){PAGE[key]=page;render();}
function render(){
  var s=state();var v=VARIANTS.filter(function(x){return x.key===s.variant})[0]||VARIANTS[0];
  document.getElementById('app').innerHTML=v.render(s);
  document.getElementById('vlabel').textContent=s.variant+' — '+v.name;
  // wire chart-bar → click expands PR drilldown (PR) or highlights row (others)
  document.querySelectorAll('.bar-rect').forEach(function(rect){
    rect.addEventListener('click',function(){
      var key=rect.getAttribute('data-key'),i=parseInt(rect.getAttribute('data-i'));
      if(key==='pr'){togglePr((state().tab==='pr'?((PAGE.pr||1)-1)*5:0)+i);}
      else{var row=document.getElementById('tr-'+key+'-'+i);if(row){document.querySelectorAll('tr[id^=tr-]').forEach(function(r){r.classList.remove('bg-sky-900/40')});row.classList.add('bg-sky-900/40');row.scrollIntoView({behavior:'smooth',block:'center'});}}
    });
  });
}
function cycle(dir){var s=state();var i=VARIANTS.findIndex(function(v){return v.key===s.variant});var n=(i+dir+VARIANTS.length)%VARIANTS.length;setParam('variant',VARIANTS[n].key);}
document.getElementById('prev').onclick=function(){cycle(-1)};
document.getElementById('next').onclick=function(){cycle(1)};
document.addEventListener('keydown',function(e){var tag=(e.target.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag)||e.target.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);});
render();

</script>
</body>
